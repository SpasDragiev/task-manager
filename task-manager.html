<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Планер за домашни</title>
    
    <link rel="stylesheet" href="task-manager.css">

    
</head>
<body>
    <div class="container">
        
        <header>
            <h1>Task Manager - Планер за задачи</h1>
            <p class="subtitle">Организирай домашните си задачи ефективно</p>
            <button id="themeToggle" class="theme-toggle-btn">Светла тема</button>
        </header>
        
        
        <div class="dashboard">
            <div class="stat-card">
                <div class="stat-icon"></div>
                <div class="stat-value" id="totalTasks">0</div>
                <div class="stat-label">Общо задачи</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"></div>
                <div class="stat-value" id="activeTasks">0</div>
                <div class="stat-label">Активни</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"></div>
                <div class="stat-value" id="completedTasks">0</div>
                <div class="stat-label">Завършени</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"></div>
                <div class="stat-value" id="todayTasks">0</div>
                <div class="stat-label">За днес</div>
            </div>
        </div>
        
        
        <div class="add-task-section">
            <h2>Добави нова задача</h2>
            <form id="addTaskForm">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskTitle">Заглавие на задачата:</label>
                        <input type="text" id="taskTitle" placeholder="Напр. Реши домашното по математика" required>
                    </div>
                    <div class="form-group">
                        <label for="taskCategory">Категория:</label>
                        <select id="taskCategory">
                            <option value="school">Училище</option>
                            <option value="hobby">Хобита</option>
                            <option value="family">Семейство</option>
                            <option value="sport">Спорт</option>
                            <option value="other">Друго</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskPriority">Приоритет:</label>
                        <select id="taskPriority">
                            <option value="high">Висок</option>
                            <option value="medium" selected>Среден</option>
                            <option value="low">Нисък</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskDeadline">Краен срок:</label>
                        <input type="date" id="taskDeadline" required>
                    </div>
                </div>
                
                <div class="form-group full-width">
                    <label for="taskDescription">Описание (опционално):</label>
                    <textarea id="taskDescription" rows="3" placeholder="Допълнителни детайли..."></textarea>
                </div>
                
                <button type="submit" class="btn-primary">
                    <span>Добави задача</span>
                </button>
            </form>
        </div>
        
        <div class="filters-section">
            <h2>Филтри и търсене</h2>
            <div class="filters-container">
                
                <div class="filter-group">
                    <label>Статус:</label>
                    <select id="filterStatus">
                        <option value="all">Всички</option>
                        <option value="active">Активни</option>
                        <option value="completed">Завършени</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>Категория:</label>
                    <select id="filterCategory">
                        <option value="all">Всички</option>
                        <option value="school">Училище</option>
                        <option value="hobby">Хобита</option>
                        <option value="family">Семейство</option>
                        <option value="sport">Спорт</option>
                        <option value="other">Друго</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>Приоритет:</label>
                    <select id="filterPriority">
                        <option value="all">Всички</option>
                        <option value="high">Висок</option>
                        <option value="medium">Среден</option>
                        <option value="low">Нисък</option>
                    </select>
                </div>
                
                <div class="filter-group search-group">
                    <label>Търсене:</label>
                    <input type="text" id="searchInput" placeholder="Търси по заглавие...">
                </div>
                
                <button class="btn-secondary" id="clearFilters">Изчисти филтрите</button>
            </div>
        </div>
        
        
        <div class="tasks-section">
            <h2>Моите задачи</h2>
            <div class="sort-options">
                <label>Сортирай по:</label>
                <select id="sortTasks">
                    <option value="deadline">Краен срок</option>
                    <option value="priority">Приоритет</option>
                    <option value="category">Категория</option>
                    <option value="created">Дата на създаване</option>
                </select>
            </div>
            <div id="tasksList" class="tasks-list">
            </div>
            <div id="emptyState" class="empty-state">
                <div class="empty-icon"></div>
                <p>Нямаш задачи. Добави първата си задача горе!</p>
            </div>
        </div>
        
        <div id="editModal" class="modal">
            <div class="modal-content">
                
                <div class="modal-header">
                    <h2>Редактирай задача</h2>
                    <button class="close-btn" id="closeModal">&times;</button>
                </div>
                
                <div class="modal-body">
                    <form id="editTaskForm">
                        <input type="hidden" id="editTaskId">
                        
                        <div class="form-group">
                            <label for="editTaskTitle">Заглавие на задачата:</label>
                            <input type="text" id="editTaskTitle" required>
                        </div>
                        <div class="form-group">
                            <label for="editTaskCategory">Категория:</label>
                            <select id="editTaskCategory">
                                <option value="school">Училище</option>
                                <option value="hobby">Хобита</option>
                                <option value="family">Семейство</option>
                                <option value="sport">Спорт</option>
                                <option value="other">Друго</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="editTaskPriority">Приоритет:</label>
                            <select id="editTaskPriority">
                                <option value="high">Висок</option>
                                <option value="medium">Среден</option>
                                <option value="low">Нисък</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="editTaskDeadline">Краен срок:</label>
                            <input type="date" id="editTaskDeadline" required>
                        </div>
                        <div class="form-group full-width">
                            <label for="editTaskDescription">Описание (опционално):</label>
                            <textarea id="editTaskDescription" rows="3"></textarea>
                        </div>
                        
                        <div class="modal-footer">
                            <button type="submit" class="btn-primary">Запази промените</button>
                            <button type="button" class="btn-secondary" id="cancelEdit">Отказ</button>
                        </div>
                    </form>
                </div>
                
            </div>
        </div>
        
        
    </div>

    <script src="task-manager.js"></script>
</body>
</html>
